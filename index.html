<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍞 路边摊自助点餐</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #fefaf3;
  --surface: #ffffff;
  --text: #3d2c1e;
  --text-secondary: #8b7355;
  --border: #e8d5c4;
  --shadow: 0 2px 12px rgba(61, 44, 30, 0.08);
  --shadow-lg: 0 8px 32px rgba(61, 44, 30, 0.14);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);

  --bread: #e89a3c;
  --bread-light: #fef5e7;
  --cookie: #c8754a;
  --cookie-light: #fdf0e8;
  --cocktail: #4ecdc4;
  --cocktail-light: #e8faf8;
  --accent: #e8734a;
  --accent-hover: #d1603a;
  --danger: #e74c3c;
  --success: #27ae60;
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
}
.header-brand { display: flex; align-items: center; gap: 8px; }
.header-logo { font-size: 28px; }
.header-title { font-size: 18px; font-weight: 700; color: var(--text); }
.header-subtitle { font-size: 11px; color: var(--text-secondary); }
.header-actions { display: flex; gap: 8px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border);
  transition: all var(--transition);
  white-space: nowrap;
  -webkit-user-select: none; user-select: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-icon {
  width: 42px; height: 42px; padding: 0; border-radius: 50%;
  font-size: 20px; border: 1.5px solid var(--border); background: var(--surface);
  position: relative;
}

/* Cart badge */
.cart-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 20px; height: 20px; padding: 0 6px;
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
}

/* ===== Category Tabs ===== */
.cat-nav {
  display: flex; gap: 8px; padding: 14px 16px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
  position: sticky; top: 66px; z-index: 40; background: var(--bg);
}
.cat-nav::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text-secondary); transition: all var(--transition);
  -webkit-user-select: none; user-select: none;
}
.cat-tab:active { transform: scale(0.96); }
.cat-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
.cat-tab.bread.active { background: var(--bread); border-color: var(--bread); color: #fff; }
.cat-tab.cookie.active { background: var(--cookie); border-color: var(--cookie); color: #fff; }
.cat-tab.cocktail.active { background: var(--cocktail); border-color: var(--cocktail); color: #fff; }

/* ===== Menu Grid ===== */
.menu-section { padding: 0 16px 100px; }
.cat-label {
  font-size: 15px; font-weight: 700; color: var(--text-secondary);
  padding: 12px 0 8px; display: flex; align-items: center; gap: 8px;
}
.cat-label:first-child { padding-top: 0; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; }
.cat-dot.bread { background: var(--bread); }
.cat-dot.cookie { background: var(--cookie); }
.cat-dot.cocktail { background: var(--cocktail); }

.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.menu-card {
  background: var(--surface); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow); transition: all var(--transition);
  cursor: pointer; display: flex; flex-direction: column;
  border: 1.5px solid transparent;
}
.menu-card:active { transform: scale(0.97); }
.menu-card:hover { box-shadow: var(--shadow-lg); }
.menu-card.unavailable { opacity: 0.5; pointer-events: none; }
.card-emoji {
  font-size: 48px; text-align: center; padding: 0; background: var(--bg);
  min-height: 80px; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.card-emoji .item-thumb {
  width: 100%; height: 120px; object-fit: cover; display: block;
}
.item-thumb-sm { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; font-size: 28px; display: inline-flex; align-items: center; justify-content: center; }
.card-emoji .item-thumb-sm { width: 36px; height: 36px; }
.card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
.card-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.card-desc { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; flex: 1; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.card-price { font-size: 16px; font-weight: 800; color: var(--accent); }
.card-price span { font-size: 12px; font-weight: 600; }
.card-add {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); flex-shrink: 0;
}
.card-add:active { transform: scale(0.9); background: var(--accent-hover); }

/* ===== Cart Panel (slide from right) ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90;
  opacity: 0; visibility: hidden; transition: all 0.3s;
  backdrop-filter: blur(2px);
}
.overlay.show { opacity: 1; visibility: visible; }

.cart-panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 100%;
  max-width: 400px; background: var(--surface); z-index: 100;
  transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
}
.cart-panel.show { transform: translateX(0); }
.cart-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.cart-header h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
.cart-close {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--bg); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cart-items {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.cart-empty {
  text-align: center; padding: 60px 20px; color: var(--text-secondary);
}
.cart-empty-icon { font-size: 56px; display: block; margin-bottom: 12px; }
.cart-item {
  display: flex; align-items: center; gap: 12px; padding: 12px;
  background: var(--bg); border-radius: var(--radius-sm);
}
.cart-item-emoji { font-size: 32px; flex-shrink: 0; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 14px; font-weight: 700; }
.cart-item-note { font-size: 11px; color: var(--text-secondary); margin-top: 2px; font-style: italic; }
.cart-item-price { font-size: 12px; color: var(--text-secondary); }
.cart-qty {
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.cart-qty button {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.cart-qty button:active { transform: scale(0.9); }
.cart-qty span { min-width: 24px; text-align: center; font-weight: 700; font-size: 14px; }
.cart-footer {
  padding: 16px 20px; border-top: 1px solid var(--border);
  background: var(--surface);
}
.cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cart-total-label { font-size: 14px; color: var(--text-secondary); }
.cart-total-price { font-size: 22px; font-weight: 800; color: var(--accent); }
.cart-total-price span { font-size: 14px; }
.btn-checkout {
  width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all var(--transition);
}
.btn-checkout:active { transform: scale(0.97); }
.btn-checkout:disabled { background: #ccc; cursor: not-allowed; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 110;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s;
  backdrop-filter: blur(2px);
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal {
  background: var(--surface); width: 100%; max-width: 500px; max-height: 85dvh;
  border-radius: 20px 20px 0 0; overflow-y: auto; padding: 24px 20px 32px;
  box-shadow: var(--shadow-lg); transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal h2 { font-size: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--bg); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ===== Form ===== */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary); }
.form-input, .form-textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 15px; font-family: inherit;
  background: var(--bg); color: var(--text); transition: all var(--transition);
  -webkit-appearance: none;
}
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.form-textarea { min-height: 70px; resize: vertical; }

/* ===== Order Success ===== */
.order-success { text-align: center; padding: 12px 0; }
.order-success-icon { font-size: 56px; margin-bottom: 10px; }
.order-text {
  background: var(--bg); border-radius: var(--radius-sm); padding: 16px;
  font-size: 13px; line-height: 1.8; text-align: left; white-space: pre-wrap;
  word-break: break-all; max-height: 240px; overflow-y: auto;
  border: 1.5px solid var(--border); font-family: monospace;
  margin: 12px 0; user-select: all;
}
.btn-copy {
  width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
  background: var(--success); color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; margin-bottom: 8px; transition: all var(--transition);
}
.btn-copy:active { transform: scale(0.97); }
.btn-copy.copied { background: #219a52; }
.btn-wechat {
  width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
  background: #07c160; color: #fff; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all var(--transition);
}
.btn-wechat:active { transform: scale(0.97); }
.payment-hint {
  margin-top: 12px; padding: 12px; border-radius: var(--radius-sm);
  background: #fff9e6; border: 1px solid #f0d78c;
  font-size: 13px; color: #8b6914;
}

/* ===== Admin ===== */
.admin-toggle {
  position: fixed; bottom: 16px; right: 16px; z-index: 60;
  width: 44px; height: 44px; border-radius: 50%; border: none;
  background: var(--text); color: #fff; font-size: 18px; cursor: pointer;
  box-shadow: var(--shadow-lg); transition: all var(--transition);
  opacity: 0.7;
}
.admin-toggle:active { transform: scale(0.9); opacity: 1; }

.admin-section { padding: 0 0 60px; }
.admin-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.admin-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.admin-tab {
  flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); background: var(--surface);
  border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
  transition: all var(--transition);
}
.admin-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
.admin-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 8px;
}
.admin-item-emoji { font-size: 28px; flex-shrink: 0; }
.admin-item-info { flex: 1; min-width: 0; }
.admin-item-name { font-size: 14px; font-weight: 700; }
.admin-item-meta { font-size: 12px; color: var(--text-secondary); }
.admin-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-edit, .btn-del {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  font-size: 14px; cursor: pointer; transition: all var(--transition);
}
.btn-edit { background: #e8f0fe; color: #1a73e8; }
.btn-del { background: #fde8e8; color: var(--danger); }
.btn-edit:active, .btn-del:active { transform: scale(0.9); }

.admin-add-form {
  background: var(--bg); border-radius: var(--radius); padding: 16px;
  margin-bottom: 16px; border: 1.5px dashed var(--border);
}
.admin-add-form h3 { font-size: 15px; margin-bottom: 12px; }

/* ===== QR Code Modal ===== */
.qr-container { text-align: center; padding: 8px 0; }
.qr-container canvas { border-radius: var(--radius-sm); border: 2px solid var(--border); }
.qr-url { font-size: 12px; color: var(--text-secondary); word-break: break-all; margin-top: 8px; }
.qr-actions { display: flex; gap: 8px; margin-top: 12px; }
.qr-actions .btn { flex: 1; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200;
  background: var(--text); color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ===== Dashboard Stats ===== */
.dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius-sm); padding: 16px 14px;
  text-align: center; box-shadow: var(--shadow); border: 1.5px solid var(--border);
}
.stat-num { font-size: 28px; font-weight: 800; color: var(--text); }
.stat-num.accent { color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ===== Responsive ===== */
@media (min-width: 768px) {
  .menu-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .cat-nav { justify-content: center; }
  .cart-panel { max-width: 420px; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="header">
  <div class="header-brand">
    <span class="header-logo">🍞</span>
    <div>
      <div class="header-title">路边摊自助点餐</div>
      <div class="header-subtitle">面包 · 饼干 · 鸡尾酒 <span id="syncStatus" style="font-size:12px" title="同步状态">☁️</span></div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-sm" onclick="refreshData()" title="刷新数据" id="refreshBtn">🔄</button>
    <button class="btn btn-sm" onclick="openQRModal()" title="分享点餐码">📱 点餐码</button>
    <button class="btn-icon" onclick="toggleCart()" id="cartBtn">
      🛒<span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </div>
</header>

<!-- ===== Category Tabs ===== -->
<nav class="cat-nav" id="catNav">
  <div class="cat-tab active" data-cat="all" onclick="filterMenu('all', this)">🔥 全部</div>
  <div class="cat-tab bread" data-cat="bread" onclick="filterMenu('bread', this)">🍞 面包</div>
  <div class="cat-tab cookie" data-cat="cookie" onclick="filterMenu('cookie', this)">🍪 饼干</div>
  <div class="cat-tab cocktail" data-cat="cocktail" onclick="filterMenu('cocktail', this)">🍸 鸡尾酒</div>
</nav>

<!-- ===== Menu ===== -->
<main class="menu-section" id="menuContainer"></main>

<!-- ===== Cart Overlay ===== -->
<div class="overlay" id="cartOverlay" onclick="toggleCart()"></div>

<!-- ===== Cart Panel ===== -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h2>🛒 购物车</h2>
    <button class="cart-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">
      <span class="cart-empty-icon">🛒</span>
      <p>购物车空空如也～</p>
      <p style="font-size:12px;margin-top:4px">快去挑选好吃的吧！</p>
    </div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span class="cart-total-label">合计</span>
      <span class="cart-total-price">¥<span id="cartTotal">0</span></span>
    </div>
    <button class="btn-checkout" id="btnCheckout" disabled onclick="openCheckout()">
      去结算
    </button>
  </div>
</div>

<!-- ===== Checkout Modal ===== -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeCheckout()" style="position:absolute;top:16px;right:16px;">✕</button>
    <h2>📋 确认订单</h2>
    <div id="checkoutSummary" style="margin-bottom:16px;font-size:14px;"></div>
    <div class="form-group">
      <label class="form-label">📍 配送地址 <span style="color:var(--danger)">*</span></label>
      <input class="form-input" id="inputAddress" placeholder="街道、门牌号、楼层房间号" maxlength="200">
    </div>
    <div class="form-group">
      <label class="form-label">📞 联系电话 <span style="color:var(--danger)">*</span></label>
      <input class="form-input" id="inputPhone" type="tel" placeholder="方便联系您" maxlength="20">
    </div>
    <div class="form-group">
      <label class="form-label">📝 订单备注</label>
      <textarea class="form-textarea" id="inputNote" placeholder="如：多放黄油、不要辣、放门口即可…" maxlength="200"></textarea>
    </div>
    <button class="btn-checkout" onclick="submitOrder()">✅ 提交订单</button>
  </div>
</div>

<!-- ===== Order Success Modal ===== -->
<div class="modal-overlay" id="successModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeSuccess()" style="position:absolute;top:16px;right:16px;">✕</button>
    <div class="order-success">
      <div class="order-success-icon">🎉</div>
      <h2>订单已生成！</h2>
      <p style="color:var(--text-secondary);font-size:14px;margin-bottom:4px">复制以下内容发送给商家微信</p>
      <div class="order-text" id="orderText"></div>
      <button class="btn-copy" id="btnCopy" onclick="copyOrder()">📋 一键复制订单</button>
      <button class="btn-wechat" onclick="openWechat()">💬 打开微信发送</button>
      <div class="payment-hint" id="paymentHint">
        <div id="paymentQRDisplay" style="text-align:center;margin-bottom:8px"></div>
        💡 <strong>支付方式：</strong>请通过微信转账付款，商家确认后即安排制作配送。<br>
        微信号：<strong id="merchantWechat"></strong>
      </div>
    </div>
  </div>
</div>

<!-- ===== Admin FAB ===== -->
<button class="admin-toggle" onclick="openAdmin()" title="商家后台">⚙️</button>

<!-- ===== Admin Modal ===== -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeAdmin()" style="position:absolute;top:16px;right:16px;">✕</button>
    <div id="adminContent"></div>
  </div>
</div>

<!-- ===== QR Code Modal ===== -->
<div class="modal-overlay" id="qrModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeQRModal()" style="position:absolute;top:16px;right:16px;">✕</button>
    <h2>📱 专属点餐二维码</h2>
    <div class="qr-container">
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">
        顾客扫码即可进入点餐页面
      </p>
      <p style="font-size:11px;color:var(--accent);margin-bottom:12px" id="qrLocalHint"></p>
      <div class="form-group">
        <input class="form-input" id="qrUrlInput" placeholder="输入点餐页面链接" style="text-align:center;font-size:13px">
      </div>

var sbOnline = true;

function sbHeaders() {
  return { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON, 'Content-Type': 'application/json' };
}

async function sbGet(table, query) {
  try {
    var url = SB_URL + '/' + table + '?' + (query || 'select=*');
    var res = await fetch(url, { headers: sbHeaders() });
    if (!res.ok) throw new Error(res.status);
    var data = await res.json();
    sbOnline = true;
    return data;
  } catch (e) {
    sbOnline = false;
    console.warn('Supabase GET failed:', e.message);
    throw e;
  }
}

async function sbPost(table, data) {
  try {
    var res = await fetch(SB_URL + '/' + table, {
      method: 'POST', headers: sbHeaders(), body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(res.status);
    sbOnline = true;
    return res.json();
  } catch (e) { sbOnline = false; throw e; }
}

async function sbPatch(table, data, query) {
  try {
    var url = SB_URL + '/' + table + (query ? '?' + query : '');
    var res = await fetch(url, {
      method: 'PATCH', headers: sbHeaders(), body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(res.status);
    sbOnline = true;
  } catch (e) { sbOnline = false; throw e; }
}

async function sbDelete(table, query) {
  try {
    await fetch(SB_URL + '/' + table + '?' + query, {
      method: 'DELETE', headers: sbHeaders()
    });
    sbOnline = true;
  } catch (e) { sbOnline = false; throw e; }
}

async function sbUpsert(table, data, query) {
  try {
    var url = SB_URL + '/' + table + (query ? '?' + query : '');
    // Try PATCH first, if 0 rows affected, POST
    var res = await fetch(url, {
      method: 'PATCH', headers: sbHeaders(), body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(res.status);
    sbOnline = true;
  } catch (e) { sbOnline = false; throw e; }
}

      var items = rows.map(menuFromDB);

      return items;

    // Table is empty — seed from localStorage or defaults

      var raw = localStorage.getItem(STORAGE_KEY);

// ╚══════════════════════════════════════════╝

function addToCart(itemId) {
  const item = menu.find(m => m.id === itemId);
  if (!item || !item.available) return;
  const existing = cart.find(c => c.id === itemId);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: itemId, qty: 1, note: '' });
  }
  updateCartUI();
  showToast(`已加入：${item.emoji} ${item.name}`);
  // Haptic feedback on mobile
  if (navigator.vibrate) navigator.vibrate(20);
}

function removeFromCart(itemId) {
  cart = cart.filter(c => c.id !== itemId);
  updateCartUI();
}

function updateQty(itemId, delta) {
  const item = cart.find(c => c.id === itemId);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) { removeFromCart(itemId); return; }
  updateCartUI();
}

function updateCartNote(itemId, note) {
  const item = cart.find(c => c.id === itemId);
  if (item) { item.note = note; }
}

function cartTotal() {
  return cart.reduce((sum, c) => {
    const m = menu.find(i => i.id === c.id);
    return sum + (m ? m.price * c.qty : 0);
  }, 0);
}

function cartCount() {
  return cart.reduce((sum, c) => sum + c.qty, 0);
}

function renderMenu() {
  const container = document.getElementById('menuContainer');
  const categories = ['bread', 'cookie', 'cocktail'];
  const catNames = { bread: '🍞 面包', cookie: '🍪 饼干', cocktail: '🍸 鸡尾酒' };
  const catClass = { bread: 'bread', cookie: 'cookie', cocktail: 'cocktail' };

  let html = '';
  for (const cat of categories) {
    let items = menu.filter(m => m.category === cat);
    if (currentFilter !== 'all' && currentFilter !== cat) continue;

    html += `<div class="cat-label"><span class="cat-dot ${catClass[cat]}"></span>${catNames[cat]}</div>`;
    html += '<div class="menu-grid">';
    for (const item of items) {
      html += `
        <div class="menu-card ${item.available ? '' : 'unavailable'}" onclick="${item.available ? `addToCart('${item.id}')` : ''}">
          <div class="card-emoji">${renderItemImg(item, 'item-thumb')}</div>
          <div class="card-body">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-desc">${escHtml(item.desc)}</div>
            <div class="card-footer">
              <div class="card-price"><span>¥</span>${item.price}</div>
              ${item.available ? `<button class="card-add" onclick="event.stopPropagation();addToCart('${item.id}')">+</button>` : '<span style="font-size:11px;color:#999">已售罄</span>'}
            </div>
          </div>
        </div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--text-secondary)">暂无菜品</div>';
}

function renderCartItems() {
  const container = document.getElementById('cartItems');
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="cart-empty">
        <span class="cart-empty-icon">🛒</span>
        <p>购物车空空如也～</p>
        <p style="font-size:12px;margin-top:4px">快去挑选好吃的吧！</p>
      </div>`;
    return;
  }
  container.innerHTML = cart.map(c => {
    const m = menu.find(i => i.id === c.id);
    if (!m) return '';
    return `
      <div class="cart-item">
        <div class="cart-item-emoji">${renderItemImg(m, 'item-thumb-sm')}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${escHtml(m.name)}</div>
          ${c.note ? `<div class="cart-item-note">📝 ${escHtml(c.note)}</div>` : ''}
          <div class="cart-item-price">¥${m.price} / 份</div>
          <input class="form-input" style="margin-top:6px;padding:6px 10px;font-size:12px"
                 placeholder="添加备注…" value="${escHtml(c.note)}"
                 onchange="updateCartNote('${c.id}', this.value)" maxlength="50">
        </div>
        <div class="cart-qty">
          <button onclick="updateQty('${c.id}', -1)">−</button>
          <span>${c.qty}</span>
          <button onclick="updateQty('${c.id}', 1)">+</button>
        </div>
      </div>`;
  }).join('');
}

function updateCartUI() {
  renderCartItems();
  const total = cartTotal();
  const count = cartCount();
  document.getElementById('cartTotal').textContent = total;
  document.getElementById('btnCheckout').disabled = count === 0;

  const badge = document.getElementById('cartBadge');
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 99 ? '99+' : count;
  } else {
    badge.style.display = 'none';
  }
}

function renderCheckoutSummary() {
  const container = document.getElementById('checkoutSummary');
  let html = '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">订单内容：</div>';
  for (const c of cart) {
    const m = menu.find(i => i.id === c.id);
    if (!m) continue;
    html += `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px">
      <span>${m.emoji} ${escHtml(m.name)} x${c.qty} ${c.note ? '📝' : ''}</span>
      <span style="font-weight:600">¥${m.price * c.qty}</span>
    </div>`;
    if (c.note) {
      html += `<div style="font-size:11px;color:var(--text-secondary);padding-left:24px;margin-bottom:2px">备注：${escHtml(c.note)}</div>`;
    }
  }
  html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1.5px solid var(--border);margin-top:8px;font-size:16px;font-weight:800">
    <span>合计</span><span style="color:var(--accent)">¥${cartTotal()}</span></div>`;
  container.innerHTML = html;
}

function filterMenu(cat, el) {
  currentFilter = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  // Add category-specific class for colored active state
  ['bread', 'cookie', 'cocktail'].forEach(c => el.classList.remove(c));
  el.classList.add('active');
  if (cat !== 'all') el.classList.add(cat);
  renderMenu();
}

function toggleCart() {
  const panel = document.getElementById('cartPanel');
  const overlay = document.getElementById('cartOverlay');
  const isOpen = panel.classList.contains('show');
  if (isOpen) {
    panel.classList.remove('show');
    overlay.classList.remove('show');
    document.body.style.overflow = '';
  } else {
    updateCartUI();
    panel.classList.add('show');
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
}

  try { settings = await loadSettings(); } catch(e) {}

function submitOrder() {
  const address = document.getElementById('inputAddress').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();
  const note = document.getElementById('inputNote').value.trim();
  if (!address) { showToast('请填写配送地址'); return; }
  if (!phone) { showToast('请填写联系电话'); return; }

  // Build order text
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  let text = '🛒 新订单来啦！\n';
  text += '━━━━━━━━━━━━━━━━\n';
  text += `🏪 ${settings.shopName}\n`;
  text += `🕐 ${timeStr}\n`;
  text += '━━━━━━━━━━━━━━━━\n';
  text += '📦 订单详情：\n';
  for (const c of cart) {
    const m = menu.find(i => i.id === c.id);
    if (!m) continue;
    text += `  ${m.emoji} ${m.name} ×${c.qty}  ¥${m.price * c.qty}\n`;
    if (c.note) text += `    📝 ${c.note}\n`;
  }
  text += '━━━━━━━━━━━━━━━━\n';
  text += `💰 合计：¥${cartTotal()}\n`;
  text += '━━━━━━━━━━━━━━━━\n';
  text += `📍 地址：${address}\n`;
  text += `📞 电话：${phone}\n`;
  if (note) text += `📝 备注：${note}\n`;
  text += '━━━━━━━━━━━━━━━━\n';
  text += `💳 请微信转账至：${settings.merchantWechat}`;

  // Save order to Supabase + local
  var orderObj = {
    id: Date.now().toString(36),
    time: now.toISOString(),
    items: cart.map(function(c) {
      const m = menu.find(i => i.id === c.id);
      return { name: m?.name || '未知', emoji: m?.emoji || '📦', qty: c.qty, price: m?.price || 0, note: c.note };
    }),
    total: cartTotal(),
    address: address, phone: phone, note: note
  };
  addOrderToDB(orderObj).catch(function() {});
  loadOrders().then(function(orders) {
    orders.unshift(orderObj);
    saveOrdersLocal(orders);
  }).catch(function() {});

  // Show success
  document.getElementById('orderText').textContent = text;
  document.getElementById('merchantWechat').textContent = settings.merchantWechat;
  // Show payment QR if uploaded
  var qrDisplay = document.getElementById('paymentQRDisplay');
  if (settings.paymentQR) {

  document.getElementById('checkoutModal').classList.remove('show');
  document.getElementById('successModal').classList.add('show');

  cart = [];

  document.getElementById('inputNote').value = '';
}

function closeSuccess() {

}

async function copyOrder() {
  const text = document.getElementById('orderText').textContent;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('btnCopy');
    btn.textContent = '✅ 已复制！';
    btn.classList.add('copied');
    showToast('订单内容已复制到剪贴板');
  } catch (e) {
    // Fallback: select text
    const el = document.getElementById('orderText');
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    showToast('请手动复制（已选中文字）');
  }
}

function renderAdminDashboard() {
  var targetId = 'adminTabContent';
  Promise.all([loadOrders(), loadMenu()]).then(function(results) {
    var orders = results[0];
    var freshMenu = results[1];
    if (!document.getElementById(targetId)) return;
    // Update global menu with fresh data
    menu = freshMenu;
    var today = new Date().toLocaleDateString('zh-CN');
    var todayOrders = orders.filter(function(o) {
      return new Date(o.time).toLocaleDateString('zh-CN') === today;
    });
    var todayRevenue = todayOrders.reduce(function(s, o) { return s + o.total; }, 0);
    var activeItems = freshMenu.filter(function(m) { return m.available; }).length;
    var totalItems = freshMenu.length;

    var html = '<div class="dashboard-grid">';
    html += '<div class="stat-card"><div class="stat-num">' + todayOrders.length + '</div><div class="stat-label">📅 今日订单</div></div>';
    html += '<div class="stat-card"><div class="stat-num accent">¥' + todayRevenue + '</div><div class="stat-label">💰 今日营业额</div></div>';
    html += '<div class="stat-card"><div class="stat-num">' + activeItems + '</div><div class="stat-label">✅ 在售商品</div></div>';
    html += '<div class="stat-card"><div class="stat-num">' + totalItems + '</div><div class="stat-label">📦 总商品数</div></div>';
    html += '</div>';

    html += '<div class="cat-label" style="margin-top:16px"><span class="cat-dot bread"></span>最近订单</div>';
    var recent = orders.slice(0, 5);
    if (recent.length === 0) {
      html += '<p style="color:var(--text-secondary);font-size:13px;padding:12px 0">暂无订单</p>';
    } else {
      for (var i = 0; i < recent.length; i++) {
        var o = recent[i];
        html += '<div style="background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center">';
        html += '<div><span style="font-weight:600">' + new Date(o.time).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}) + '</span> ' + o.items.map(function(i){return (i.emoji||'📦')+i.name+'×'+i.qty}).join(' ') + '</div>';
        html += '<span style="font-weight:700;color:var(--accent)">¥' + o.total + '</span></div>';
      }
    }

    html += '<div class="cat-label" style="margin-top:16px"><span class="cat-dot cocktail"></span>快捷操作</div>';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
    html += '<button class="btn btn-primary" onclick="renderAdminPanel(\'menu\')" style="flex:1;min-width:100px">➕ 添加菜品</button>';
    html += '<button class="btn" onclick="renderAdminPanel(\'orders\')" style="flex:1;min-width:100px">📦 查看订单</button>';
    html += '<button class="btn" onclick="renderAdminPanel(\'settings\')" style="flex:1;min-width:100px">⚙️ 店铺设置</button>';
    html += '</div>';

    document.getElementById(targetId).innerHTML = html;
  }).catch(function() {

      document.getElementById(targetId).innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-secondary)">加载失败，请检查网络</p>';

function addNewItem() {
  var cat = document.getElementById('addCat').value;

      id: Date.now().toString(36),

      available: true, image: imageData || ''
    };

function saveEditItem(itemId) {
  var item = menu.find(function(m) { return m.id === itemId; });
  if (!item) return;
  item.category = document.getElementById('editCat').value;
  item.emoji = document.getElementById('editEmoji').value.trim() || '📦';
  item.name = document.getElementById('editName').value.trim();
  item.desc = document.getElementById('editDesc').value.trim();
  item.price = parseInt(document.getElementById('editPrice').value) || 0;
  item.available = document.getElementById('editAvailable').checked;
  if (!item.name) { showToast('请输入菜品名称'); return; }
  if (item.price <= 0) { showToast('请输入有效价格'); return; }

  var doSave = async function(imageData) {
    if (imageData) item.image = imageData;
    else if (imageData === '') item.image = ''; // explicitly cleared
    var synced = await saveMenu(menu);
    checkStorageUsage();
    renderMenu();
    renderAdminPanel('menu');
    showToast((synced ? '已更新 ✅' : '已更新（云端同步失败）') + ' ' + item.emoji + ' ' + item.name);
  };

  var fileInput = document.getElementById('editImageFile');
  if (fileInput && fileInput.files && fileInput.files[0]) {
    handleImageUpload(fileInput.files[0], doSave);
  } else {
    doSave(null); // null = keep existing image
  }
}

async function toggleItemAvailable(itemId) {
  const item = menu.find(m => m.id === itemId);
  if (!item) return;
  item.available = !item.available;
  await saveMenu(menu);
  renderMenu();
  renderAdminPanel('menu');
  updateCartUI();
  showToast(item.available ? `已上架：${item.name}` : `已下架：${item.name}`);
}

async function deleteItem(itemId) {
  const item = menu.find(m => m.id === itemId);
  if (!item) return;
  if (!confirm(`确定删除「${item.name}」吗？此操作不可恢复。`)) return;
  menu = menu.filter(m => m.id !== itemId);
  cart = cart.filter(c => c.id !== itemId);
  await saveMenu(menu);
  renderMenu();
  renderAdminPanel('menu');
  updateCartUI();
  showToast(`已删除：${item.name}`);
}

function deleteOrder(orderId) {
  if (!confirm('确定删除这条订单记录吗？')) return;
  deleteOrderFromDB(orderId).catch(function(){});
  loadOrders().then(function(orders) {
    var filtered = orders.filter(function(o) { return o.id !== orderId; });
    saveOrdersLocal(filtered);
    // Refresh the orders view if admin panel is open
    if (document.getElementById('adminModal').classList.contains('show')) {
      var activeTab = document.querySelector('.admin-tab.active');
      if (activeTab && activeTab.textContent.includes('订单')) renderAdminPanel('orders');
    }
  }).catch(function(){});
  renderAdminPanel('orders');
  showToast('订单已删除');
}

async function resetMenu() {
  if (!confirm('确定恢复为默认菜单吗？您添加和修改的菜品将全部丢失。')) return;
  menu = [...DEFAULT_MENU];
  var synced = await saveMenu(menu);
  renderMenu();
  renderAdminPanel('menu');
  updateCartUI();
  showToast(synced ? '菜单已恢复默认并同步 ✅' : '菜单已恢复默认（云端同步失败）');
}

function clearOrders() {
  if (!confirm('确定清空所有订单记录吗？')) return;
  clearOrdersFromDB().catch(function(){});
  saveOrdersLocal([]);
  renderAdminPanel('orders');
  showToast('订单记录已清空');
}

function openQRModal() {
  document.getElementById('qrModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  const isLocal = window.location.protocol === 'file:';
  const hint = document.getElementById('qrLocalHint');
  const input = document.getElementById('qrUrlInput');

  if (isLocal) {
    hint.innerHTML = '⚠️ 当前为本地文件，请部署后将公网链接粘贴到下方';
    input.value = '';
    input.placeholder = '粘贴部署链接，如 https://roadside-ordering.vercel.app';
  } else {
    hint.textContent = '';
    input.value = window.location.href;
  }
  input.oninput = function() { generateQR(); };
  generateQR();
}

function closeQRModal() {
  document.getElementById('qrModal').classList.remove('show');
  document.body.style.overflow = '';
}

function getQRUrl() {
  var input = document.getElementById('qrUrlInput');
  return input.value.trim() || window.location.href;
}

function generateQR() {
  var container = document.getElementById('qrCanvas');
  var url = getQRUrl();
  document.getElementById('qrUrl').textContent = url || '（请输入链接）';
  container.innerHTML = '';

  if (!url || url.indexOf('file:') === 0) {
    container.innerHTML = '<p style="color:var(--text-secondary);padding:40px;text-align:center">👆<br>请在上方输入点餐页面的<br>公网链接生成二维码</p>';
    return;
  }

  var size = 220;
  // Use api.qrserver.com — reliable, works everywhere
  var img = new Image();
  img.width = size;
  img.height = size;
  img.style.border = '2px solid var(--border)';
  img.style.borderRadius = 'var(--radius-sm)';
  img.onload = function() {
    container.innerHTML = '';
    container.appendChild(img);
    container.dataset.qrData = img.src;
  };
  img.onerror = function() {
    // Fallback: embedded canvas generator
    generateQRLocal(url, size, container);
  };
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&data=' + encodeURIComponent(url);
}

function generateQRLocal(url, size, container) {
  try {
    var tn, qrInst;
    for (tn = 1; tn <= 40; tn++) {
      qrInst = qrcode(tn, 'L');
      try { qrInst.addData(url); qrInst.make(); break; }
      catch (e) { continue; }
    }
    if (!qrInst) throw new Error('QR too large');
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    var mc = qrInst.getModuleCount();
    var cs = Math.floor(size / mc);
    var off = Math.floor((size - cs * mc) / 2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#3d2c1e';
    for (var r = 0; r < mc; r++) {
      for (var c = 0; c < mc; c++) {
        if (qrInst.isDark(r, c)) {
          ctx.fillRect(off + c * cs, off + r * cs, cs, cs);
        }
      }
    }
    container.innerHTML = '';
    container.appendChild(canvas);
    container.dataset.qrData = canvas.toDataURL('image/png');
  } catch (e) {
    container.innerHTML = '<p style="color:var(--danger);padding:20px;text-align:center">二维码生成失败<br><small>请检查链接是否正确</small></p>';
  }
}

function copyQRUrl() {
  var url = getQRUrl();
  if (!url || url.indexOf('file:') === 0) { showToast('请先输入公网链接'); return; }
  navigator.clipboard.writeText(url).then(function() {
    showToast('链接已复制到剪贴板');
  }).catch(function() {
    showToast('复制失败，请手动复制');
  });
}

function downloadQR() {
  var dataUrl = document.getElementById('qrCanvas').dataset.qrData;
  if (!dataUrl) { showToast('二维码尚未生成'); return; }
  var a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'roadside-ordering-qr.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('二维码已保存');
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Image upload: FileReader → compressed base64
function handleImageUpload(file, callback, maxKB) {
  maxKB = maxKB || 80;
  if (!file) return;
  if (!file.type.match(/image\/(jpeg|png|webp|gif)/)) {
    showToast('仅支持 JPG/PNG/WebP/GIF 图片');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      // Scale down if needed: max dimension 300px
      var maxDim = 300;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        var ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      // Compress to JPEG ~80KB
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      if (dataUrl.length > maxKB * 1024) {
        dataUrl = canvas.toDataURL('image/jpeg', 0.4);
      }
      callback(dataUrl);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Preview uploaded image in the form
function previewImage(fileInput, previewId) {
  var file = fileInput.files && fileInput.files[0];
  var preview = document.getElementById(previewId);
  if (!preview) return;
  if (!file) { preview.innerHTML = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:120px;max-height:120px;border-radius:8px;border:2px solid var(--border)">';
  };
  reader.readAsDataURL(file);
}

// Check total localStorage usage
function checkStorageUsage() {
  var total = 0;
  for (var i = 0; i < localStorage.length; i++) {
    total += localStorage.getItem(localStorage.key(i)).length;
  }
  // >4MB warning (limit is ~5MB)
  if (total > 4 * 1024 * 1024) {
    showToast('⚠️ 存储空间接近上限，建议清理旧图片');
  }
}

function getItemImage(item) {
  return item.image || '';
}

function renderItemImg(item, cls) {
  cls = cls || '';
  var img = getItemImage(item);
  if (img) return '<img src="' + img + '" class="' + cls + '" alt="' + escHtml(item.name) + '" loading="lazy">';
  return '<span class="' + cls + '">' + item.emoji + '</span>';
}

    setupPositionProbePattern: function(row, col) {

async function refreshData(showMsg) {
  var btn = document.getElementById('refreshBtn');
  if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
  try {
    menu = await loadMenu();
    settings = await loadSettings();
    renderMenu();
    updateCartUI();
    // Also refresh admin panel if open
    if (isAdminLoggedIn && document.getElementById('adminModal').classList.contains('show')) {
      var activeTab = document.querySelector('.admin-tab.active');
      if (activeTab) {
        var tabText = activeTab.textContent;
        if (tabText.includes('概览')) renderAdminPanel('dashboard');
        else if (tabText.includes('菜品')) renderAdminPanel('menu');
        else if (tabText.includes('订单')) renderAdminPanel('orders');
        else if (tabText.includes('设置')) renderAdminPanel('settings');
      }
    }
    updateSyncStatus('online');
    if (btn) { btn.textContent = '✅'; setTimeout(function() { btn.textContent = '🔄'; }, 1000); }
    if (showMsg !== false) showToast('数据已同步 ✅');
  } catch(e) {
    updateSyncStatus('offline');
    if (btn) { btn.textContent = '⚠️'; btn.disabled = false; setTimeout(function() { btn.textContent = '🔄'; }, 2000); }
    if (showMsg !== false) showToast('同步失败，请检查网络 ⚠️');
  }
}

function updateSyncStatus(status) {
  var el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'online') {
    el.textContent = '☁️';
    el.title = '已连接云同步';
    el.style.opacity = '0.6';
  } else {
    el.textContent = '📵';
    el.title = '离线，使用本地缓存';
    el.style.opacity = '1';
  }
}

async function init() {
  menu = await loadMenu();
  settings = await loadSettings();
  renderMenu();
  updateCartUI();
  updateSyncStatus(sbOnline ? 'online' : 'offline');

  // Auto-refresh when user returns to the page
  var lastRefresh = Date.now();
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && Date.now() - lastRefresh > 10000) {
      lastRefresh = Date.now();
      refreshData(false);
    }
  });

  window.addEventListener('popstate', function(e) {
    if (document.getElementById('cartPanel').classList.contains('show')) toggleCart();
    if (document.getElementById('checkoutModal').classList.contains('show')) closeCheckout();
    if (document.getElementById('successModal').classList.contains('show')) closeSuccess();
    if (document.getElementById('adminModal').classList.contains('show')) closeAdmin();
    if (document.getElementById('qrModal').classList.contains('show')) closeQRModal();
  });
}

init().catch(function(e) { console.error('Init failed:', e); });
</script>
